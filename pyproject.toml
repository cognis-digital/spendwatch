[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spendwatch"
version = "0.1.0"
description = "Multi-provider LLM usage, cost, and limit meter with budget guards, an MCP endpoint, and CI-friendly exit codes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cognis Digital" }]
keywords = ["llm", "cost", "budget", "usage", "observability", "mcp", "prometheus", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
# Core has ZERO third-party runtime dependencies (stdlib only).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
spendwatch = "spendwatch.cli:main"

[project.urls]
Homepage = "https://cognis.digital"

[tool.setuptools]
packages = ["spendwatch", "spendwatch.providers", "spendwatch.outputs", "spendwatch.mcp"]

[tool.setuptools.package-data]
spendwatch = ["pricing_table.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
